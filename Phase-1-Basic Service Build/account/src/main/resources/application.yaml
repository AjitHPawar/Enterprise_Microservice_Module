spring:
  application:
    name: account

server:
  port: 1111

#Add Colored Console Logging Pattern For Each Log Level
logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
  level:
    root: INFO

#Eureka Server Configurations
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:5555/eureka/

#Disable the Spring Cloud LoadBalancer Caching for old data
spring:
  cloud:
    loadbalancer:
      cache:
        enabled: false

